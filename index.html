<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GoalSave – Savings Goal Planner</title>
<meta name="description" content="GoalSave helps you save toward your goals with clarity and calm, ADHD-friendly design.">
<style>
/* ===================== RESET & BASE ===================== */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  min-height:100vh;
  transition:background .2s ease,color .2s ease;
}
h1,h2,h3,h4,p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;margin:0;padding:0;}
svg{display:block;flex-shrink:0;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;}

/* ===================== THEME VARIABLES ===================== */
:root, [data-theme="dark"]{
  --bg:#0e1320;
  --bg-soft:#0b0f1a;
  --card:#161d30;
  --card-hover:#1b2338;
  --card-elevated:#1c2438;
  --border:rgba(255,255,255,0.07);
  --border-strong:rgba(255,255,255,0.14);
  --text:#f3efe6;
  --text-secondary:#8b93ab;
  --text-faint:#5c6480;
  --gold:#fcbe28;
  --gold-soft:rgba(252,190,40,0.15);
  --green:#3ddc97;
  --green-soft:rgba(61,220,151,0.15);
  --blue:#5b9df9;
  --blue-soft:rgba(91,157,249,0.15);
  --purple:#a78bfa;
  --purple-soft:rgba(167,139,250,0.15);
  --orange:#fb923c;
  --orange-soft:rgba(251,146,60,0.15);
  --red:#f87171;
  --red-soft:rgba(248,113,113,0.15);
  --teal:#2dd4bf;
  --teal-soft:rgba(45,212,191,0.15);
  --pink:#f472b6;
  --pink-soft:rgba(244,114,182,0.15);
  --shadow:0 10px 30px rgba(0,0,0,0.35);
  --shadow-sm:0 4px 14px rgba(0,0,0,0.25);
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}
[data-theme="light"]{
  --bg:#f4f2ec;
  --bg-soft:#ece9e1;
  --card:#ffffff;
  --card-hover:#faf9f6;
  --card-elevated:#ffffff;
  --border:rgba(20,20,30,0.08);
  --border-strong:rgba(20,20,30,0.16);
  --text:#20232f;
  --text-secondary:#5c637a;
  --text-faint:#8b93ab;
  --gold:#fcbe28;
  --gold-soft:rgba(252,190,40,0.12);
  --green:#159a68;
  --green-soft:rgba(21,154,104,0.12);
  --blue:#2f6fe0;
  --blue-soft:rgba(47,111,224,0.12);
  --purple:#7c5cf0;
  --purple-soft:rgba(124,92,240,0.12);
  --orange:#e0711c;
  --orange-soft:rgba(224,113,28,0.12);
  --red:#d5453f;
  --red-soft:rgba(213,69,63,0.12);
  --teal:#0f9d8f;
  --teal-soft:rgba(15,157,143,0.12);
  --pink:#d3448a;
  --pink-soft:rgba(211,68,138,0.12);
  --shadow:0 10px 24px rgba(30,30,40,0.08);
  --shadow-sm:0 4px 10px rgba(30,30,40,0.06);
}
body.density-compact .card{padding:1rem !important;}
body.density-compact .stack-gap{gap:.6rem !important;}

/* focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
  border-radius:6px;
}

/* ===================== LAYOUT ===================== */
.app{display:flex;min-height:100vh;width:100%;}
.sidebar{
  width:264px;flex-shrink:0;background:var(--bg-soft);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:1.4rem 1.1rem;position:fixed;top:0;left:0;bottom:0;
  z-index:60;transition:transform .25s ease;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:.6rem;padding:.3rem .4rem 1.4rem;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--gold),#d99a1c);display:flex;align-items:center;justify-content:center;color:#1a1300;flex-shrink:0;}
.brand-name{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;}
.icon-btn.sidebar-close{display:none;}
.nav-list{display:flex;flex-direction:column;gap:.25rem;margin-top:.4rem;}
.nav-item{
  display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:var(--radius-sm);
  color:var(--text-secondary);font-weight:600;font-size:.92rem;border:1px solid transparent;background:none;width:100%;text-align:left;
}
.nav-item svg{width:19px;height:19px;}
.nav-item:hover{background:var(--card);color:var(--text);}
.nav-item.active{background:var(--gold-soft);color:var(--gold);border-color:rgba(240,180,41,0.25);}
.sidebar-footer{margin-top:auto;padding-top:1rem;}
.mini-motivation{
  background:linear-gradient(160deg,var(--gold-soft),transparent);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:.9rem;font-size:.82rem;color:var(--text-secondary);line-height:1.4;
}
.mini-motivation strong{display:block;color:var(--text);font-size:.88rem;margin-bottom:.15rem;}

/* ===================== DEMO MODE ===================== */
.demo-badge{
  display:inline-flex;align-items:center;gap:.3rem;padding:.16rem .5rem;border-radius:999px;
  background:var(--purple-soft);color:var(--purple);font-size:.65rem;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;flex-shrink:0;
}
.demo-badge svg{width:10px;height:10px;}
.buy-now-wrap{margin-bottom:.8rem;}
.buy-now-btn{
  display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;
  padding:.6rem .8rem;border-radius:var(--radius-sm);font-weight:700;font-size:.82rem;
  background:linear-gradient(145deg,var(--gold),#d99a1c);color:#1a1300;border:1px solid transparent;
  transition:filter .15s ease,transform .1s ease;
}
.buy-now-btn:hover{filter:brightness(1.06);}
.buy-now-btn:active{transform:scale(.98);}
.buy-now-btn svg{width:15px;height:15px;}
.demo-reset-note{
  font-size:.68rem;color:var(--text-faint);text-align:center;margin-top:.55rem;line-height:1.35;
}

.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:55;}
.sidebar-backdrop.show{display:block;}

.main{flex:1;margin-left:264px;padding:1.8rem 2.2rem 4rem;min-width:0;max-width:100%;}
.page{display:none;}
.page.active-page{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.mobile-topbar{display:none;position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--border);
  align-items:center;justify-content:space-between;padding:.8rem 1rem;margin:-1.8rem -2.2rem 1.2rem;}

@media (max-width:1023px){
  .sidebar{transform:translateX(-100%);width:78vw;max-width:300px;box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .icon-btn.sidebar-close{display:flex;margin-left:auto;}
  .main{margin-left:0;padding:1rem 1rem 5rem;}
  .mobile-topbar{display:flex;margin:-1rem -1rem 1.2rem;}
}
@media (max-width:480px){
  .main{padding:.85rem .85rem 5rem;}
}

/* ===================== COMMON ELEMENTS ===================== */
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--border);color:var(--text-secondary);flex-shrink:0;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong);}
.icon-btn svg{width:18px;height:18px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.65rem 1.1rem;border-radius:var(--radius-sm);font-weight:700;font-size:.88rem;
  border:1px solid transparent;transition:transform .1s ease,filter .15s ease;white-space:nowrap;
}
.btn svg{width:16px;height:16px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--gold);color:#231a02;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-secondary{background:var(--card);color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover{background:var(--card-hover);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:var(--red);color:#2b0505;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-sm{padding:.45rem .8rem;font-size:.8rem;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:1.3rem;box-shadow:var(--shadow-sm);
}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .65rem;border-radius:999px;font-size:.72rem;font-weight:700;}
.pill svg{width:12px;height:12px;flex-shrink:0;}
.pill-active{background:var(--blue-soft);color:var(--blue);}
.pill-paused{background:rgba(150,150,160,0.15);color:var(--text-secondary);}
.pill-completed{background:var(--green-soft);color:var(--green);}

.progress-track{width:100%;height:9px;border-radius:999px;background:rgba(255,255,255,0.07);overflow:hidden;}
[data-theme="light"] .progress-track{background:rgba(0,0,0,0.07);}
.progress-fill{height:100%;border-radius:999px;transition:width .4s ease;}

.section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:.6rem;flex-wrap:wrap;}
.section-title{display:flex;align-items:center;gap:.5rem;font-size:1.05rem;font-weight:800;}
.section-title svg{width:19px;height:19px;color:var(--gold);}
.view-all{display:inline-flex;align-items:center;gap:.3rem;color:var(--text-secondary);font-weight:700;font-size:.83rem;background:none;border:none;padding:.3rem;}
.view-all:hover{color:var(--gold);}
.view-all svg{width:15px;height:15px;}

.icon-badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-badge svg{width:22px;height:22px;}

.empty-state{text-align:center;padding:2.4rem 1.2rem;color:var(--text-secondary);}
.empty-state .icon-badge{margin:0 auto 1rem;width:56px;height:56px;background:var(--gold-soft);color:var(--gold);}
.empty-state .icon-badge svg{width:26px;height:26px;}
.empty-state h3{color:var(--text);font-size:1.05rem;margin-bottom:.35rem;}
.empty-state p{font-size:.88rem;margin-bottom:1.1rem;}

.grid{display:grid;gap:1.1rem;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.hidden{display:none !important;}
.text-secondary{color:var(--text-secondary);}
.text-faint{color:var(--text-faint);}
.mt-1{margin-top:.5rem;} .mt-2{margin-top:1rem;} .mt-3{margin-top:1.5rem;}

/* ===================== HEADER / DASHBOARD ===================== */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap;}
.page-header h1{font-size:1.4rem;font-weight:800;letter-spacing:-.01em;}
.page-header p{color:var(--text-secondary);font-size:.9rem;margin-top:.25rem;}

.greeting-eyebrow{color:var(--text-secondary);font-size:.85rem;font-weight:600;}
.greeting-name{font-size:1.6rem;font-weight:800;display:flex;align-items:center;gap:.5rem;margin-top:.15rem;}
.greeting-tagline{color:var(--text-secondary);margin-top:.35rem;font-size:.92rem;}
.edit-name-btn{background:none;border:none;color:var(--text-faint);width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}
.edit-name-btn:hover{color:var(--gold);background:var(--gold-soft);}
.edit-name-btn svg{width:15px;height:15px;}

.quick-actions{display:flex;gap:.7rem;flex-wrap:wrap;margin:1.2rem 0 1.6rem;}
.quick-actions .btn{flex:0 0 auto;}

.stat-card{display:flex;align-items:center;justify-content:space-between;gap:.6rem;}
.stat-card-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.stat-card-icon svg{width:22px;height:22px;}
.stat-label{font-size:.8rem;color:var(--text-secondary);font-weight:600;}
.stat-value{font-size:1.5rem;font-weight:800;margin-top:.2rem;letter-spacing:-.02em;}

.dash-columns{display:grid;grid-template-columns:1fr 340px;gap:1.4rem;align-items:start;margin-top:1.6rem;}
@media (max-width:1023px){.dash-columns{grid-template-columns:1fr;}}
.stack{display:flex;flex-direction:column;gap:1.4rem;}

/* goal preview card */
.goal-card{display:flex;flex-direction:column;gap:.85rem;position:relative;transition:border-color .15s ease,transform .15s ease;}
.goal-card:hover{border-color:var(--border-strong);}
.goal-card-top{display:flex;align-items:flex-start;justify-content:space-between;}
.goal-card-body{background:none;border:none;padding:0;text-align:left;color:inherit;width:100%;display:flex;flex-direction:column;gap:.55rem;border-radius:10px;}
.goal-card-body:hover .goal-name{color:var(--gold);}
.goal-name{font-weight:800;font-size:1.02rem;transition:color .15s ease;}
.goal-amounts{font-size:.85rem;color:var(--text-secondary);}
.goal-amounts b{color:var(--text);font-size:.95rem;}
.goal-meta-row{display:flex;align-items:center;justify-content:space-between;font-size:.78rem;color:var(--text-secondary);margin-top:.1rem;}
.milestone-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;padding:.3rem .6rem;border-radius:999px;background:var(--gold-soft);color:var(--gold);width:fit-content;}
.milestone-chip svg{width:12px;height:12px;}
.milestone-chip.done{background:var(--green-soft);color:var(--green);}
.goal-card-actions{display:flex;gap:.5rem;margin-top:.2rem;}
.goal-card.is-paused{opacity:.72;}
.goal-card.is-completed{border-color:rgba(61,220,151,0.35);}

.card-menu{position:relative;}
.menu-dropdown{
  position:absolute;right:0;top:44px;background:var(--card-elevated);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);box-shadow:var(--shadow);min-width:170px;z-index:30;overflow:hidden;padding:.35rem;
}
.menu-dropdown button{
  display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;padding:.55rem .65rem;background:none;border:none;color:var(--text);
  font-size:.85rem;font-weight:600;border-radius:8px;
}
.menu-dropdown button svg{width:16px;height:16px;flex-shrink:0;}
.menu-dropdown button:hover{background:var(--card-hover);}
.menu-dropdown button.danger{color:var(--red);}

/* fund preview row */
.fund-row{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-bottom:1px solid var(--border);}
.fund-row:last-child{border-bottom:none;}
.fund-row-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fund-row-icon svg{width:16px;height:16px;}
.fund-row-body{flex:1;min-width:0;}
.fund-row-top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;margin-bottom:.3rem;}
.fund-row-top span:last-child{color:var(--text-secondary);font-weight:600;font-size:.78rem;}

/* milestone stepper */
.stepper{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding:.6rem 0 0;}
.stepper::before{content:"";position:absolute;top:22px;left:5%;right:5%;height:2px;background:var(--border-strong);z-index:0;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;z-index:1;gap:.4rem;min-width:0;}
.step-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--border-strong);color:var(--text-faint);font-size:.7rem;font-weight:800;}
.step-dot svg{width:15px;height:15px;}
.step.reached .step-dot{background:var(--green);border-color:var(--green);color:#fff;}
.step.next .step-dot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);}
.step-label{font-size:.78rem;font-weight:800;}
.step-amount{font-size:.72rem;color:var(--text-secondary);}
.step-status{font-size:.68rem;font-weight:700;color:var(--green);}
.step.next .step-status{color:var(--gold);}
.step:not(.reached):not(.next) .step-status{color:var(--text-faint);}

/* ===================== FORMS ===================== */
.field{margin-bottom:1rem;}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--text-secondary);margin-bottom:.4rem;}
.field-hint{font-size:.75rem;color:var(--text-faint);margin-top:.3rem;}
.field-error{font-size:.76rem;color:var(--red);margin-top:.3rem;display:none;}
.field.invalid .field-error{display:block;}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red) !important;}
.input, select.input, textarea.input{
  width:100%;padding:.7rem .85rem;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--bg-soft);color:var(--text);font-size:.9rem;
}
.input:focus{outline:2px solid var(--gold);outline-offset:1px;}
textarea.input{resize:vertical;min-height:70px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media (max-width:480px){.field-row{grid-template-columns:1fr;}}

.icon-picker,.color-picker{display:flex;flex-wrap:wrap;gap:.5rem;}
.pick-btn{width:42px;height:42px;border-radius:10px;border:2px solid var(--border);background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
.pick-btn svg{width:19px;height:19px;}
.pick-btn.selected{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;}
.swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--bg-soft);}

.switch{position:relative;display:inline-flex;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-track{position:absolute;inset:0;background:var(--border-strong);border-radius:999px;transition:.2s;cursor:pointer;}
.switch-track::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .switch-track{background:var(--gold);}
.switch input:checked + .switch-track::before{transform:translateX(18px);}
.switch input:focus-visible + .switch-track{outline:2px solid var(--gold);outline-offset:2px;}

.segmented{display:flex;background:var(--bg-soft);border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:4px;gap:4px;}
.segmented button{flex:1;padding:.55rem .6rem;border-radius:8px;background:none;border:none;color:var(--text-secondary);font-weight:700;font-size:.83rem;display:flex;align-items:center;justify-content:center;gap:.4rem;}
.segmented button svg{width:15px;height:15px;}
.segmented button.active{background:var(--gold);color:#231a02;}

/* ===================== MODALS ===================== */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,12,0.6);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem;backdrop-filter:blur(2px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--card-elevated);border:1px solid var(--border-strong);border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow);padding:1.5rem;animation:modalIn .18s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.modal.modal-wide{max-width:640px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;}
.modal-header h2{font-size:1.15rem;font-weight:800;}
.modal-actions{display:flex;justify-content:flex-end;gap:.7rem;margin-top:1.3rem;flex-wrap:wrap;}
.modal-actions.spread{justify-content:space-between;}

/* detail modal */
.detail-head{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem;}
.detail-icon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
.detail-icon svg{width:28px;height:28px;}
.detail-title{font-size:1.2rem;font-weight:800;}
.detail-status-msg{font-weight:700;font-size:.95rem;margin:.9rem 0;padding:.8rem 1rem;border-radius:var(--radius-sm);background:var(--gold-soft);color:var(--gold);}
.detail-status-msg.done{background:var(--green-soft);color:var(--green);}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1rem;}
@media (max-width:480px){.detail-grid{grid-template-columns:repeat(2,1fr);}}
.detail-stat{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.7rem .8rem;}

/* =========================================================================

========================================================================= */
function uid(prefix){ return (prefix||"id")+"_"+Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function nowISO(){ return new Date().toISOString(); }
function round2(n){ n = Number(n)||0; return Math.round((n + Number.EPSILON) * 100) / 100; }
function clamp(n,min,max){ return Math.min(max,Math.max(min,n)); }
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
  });
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parseLocalDate(str){
  if(!str) return null;
  const parts = String(str).split("-").map(Number);
  if(parts.length<3 || parts.some(isNaN)) return null;
  return new Date(parts[0], parts[1]-1, parts[2]);
}
function isValidDateStr(str){
  const d = parseLocalDate(str);
  return !!d && !isNaN(d.getTime());
}
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function toDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function formatDate(str){
  const d = parseLocalDate(str);
  if(!d) return "—";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function daysLeft(dateStr){
  const target = parseLocalDate(dateStr);
  if(!target) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  target.setHours(0,0,0,0);
  return Math.round((target-today)/86400000);
}
function deadlineText(dateStr, status){
  if(status==="completed") return "Completed";
  if(!dateStr) return "No deadline set";
  const d = daysLeft(dateStr);
  if(d===null) return "No deadline set";
  if(d<0) return "Target date passed";
  if(d===0) return "Due today";
  return d+" day"+(d===1?"":"s")+" left";
}
function formatMoney(amount){
  const cur = (App.data && App.data.settings && App.data.settings.currency) || "USD";
  const n = Number(amount)||0;
  try{
    return new Intl.NumberFormat(undefined,{style:"currency",currency:cur,maximumFractionDigits: cur==="JPY"?0:2, minimumFractionDigits: cur==="JPY"?0:2}).format(n);
  }catch(e){
    return "$"+n.toFixed(2);
  }
}
function colorHex(key){
  const el = document.documentElement;
  const found = COLORS.find(c=>c.key===key) || COLORS[0];
  return getComputedStyle(el).getPropertyValue(found.var).trim() || "#fcbe28";
}
function colorSoft(key){
  const el = document.documentElement;
  const found = COLORS.find(c=>c.key===key) || COLORS[0];
  return getComputedStyle(el).getPropertyValue(found.soft).trim() || "rgba(240,180,41,.15)";
}

function defaultSettings(){

  };

function validateData(raw){
  try{
    if(!raw || typeof raw !== "object") return null;
    if(!Array.isArray(raw.goals) || !Array.isArray(raw.contributions) || !Array.isArray(raw.sinkingFunds) || !Array.isArray(raw.milestones)) return null;
    const goals = raw.goals.filter(g => g && typeof g.id==="string" && typeof g.name==="string" && g.name.trim() && typeof g.target==="number" && g.target>0)
      .map(g=>({
        id:g.id, name:g.name, icon: ICON_PICKS.includes(g.icon)?g.icon:"target",
        color: COLORS.some(c=>c.key===g.color)?g.color:"gold",
        target: round2(g.target), targetDate: (g.targetDate && isValidDateStr(g.targetDate))? g.targetDate : "",
        status: ["active","paused","completed"].includes(g.status)?g.status:"active",
        note: typeof g.note==="string"? g.note : "",
        createdAt: g.createdAt || nowISO(), updatedAt: g.updatedAt || g.createdAt || nowISO()
      }));
    const goalIds = new Set(goals.map(g=>g.id));
    const funds = raw.sinkingFunds.filter(f=>f && typeof f.id==="string" && typeof f.name==="string" && f.name.trim() && typeof f.target==="number" && f.target>0)
      .map(f=>({
        id:f.id, name:f.name, icon: ICON_PICKS.includes(f.icon)?f.icon:"wallet",
        color: COLORS.some(c=>c.key===f.color)?f.color:"blue",
        target: round2(f.target), deadline:(f.deadline && isValidDateStr(f.deadline))? f.deadline : "",
        status: ["active","paused","completed"].includes(f.status)?f.status:"active",
        note: typeof f.note==="string"? f.note : "",
        createdAt: f.createdAt || nowISO(), updatedAt: f.updatedAt || f.createdAt || nowISO()
      }));
    const fundIds = new Set(funds.map(f=>f.id));
    const contributions = raw.contributions.filter(c=>c && typeof c.id==="string" && typeof c.amount==="number" && c.amount>0 && (c.targetType==="goal"||c.targetType==="fund") && typeof c.targetId==="string" && isValidDateStr(c.date))
      .filter(c=> c.targetType==="goal" ? goalIds.has(c.targetId) : fundIds.has(c.targetId))
      .map(c=>({ id:c.id, targetType:c.targetType, targetId:c.targetId, amount: round2(c.amount), date:c.date, note: typeof c.note==="string"?c.note:"", createdAt: c.createdAt||nowISO() }));
    const milestones = raw.milestones.filter(m=>m && typeof m.id==="string" && typeof m.goalId==="string" && goalIds.has(m.goalId) && (m.type==="percent"||m.type==="amount") && typeof m.value==="number" && m.value>0)
      .map(m=>({ id:m.id, goalId:m.goalId, type:m.type, value: round2(m.value), label: typeof m.label==="string" && m.label.trim() ? m.label : (m.type==="percent"? m.value+"%": "Custom"), note: typeof m.note==="string"?m.note:"", createdAt:m.createdAt||nowISO() }));
    const settings = Object.assign(defaultSettings(), (raw.settings && typeof raw.settings==="object")?raw.settings:{});
    if(!CURRENCIES.some(c=>c.code===settings.currency)) settings.currency = "USD";
    if(!["dark","light","system"].includes(settings.theme)) settings.theme="light";
    if(!["comfortable","compact"].includes(settings.density)) settings.density="comfortable";
    const meta = (raw.meta && typeof raw.meta==="object") ? raw.meta : {createdAt: nowISO(), lastModified: nowISO()};
    return {version:1, settings, goals, contributions, sinkingFunds:funds, milestones, meta};
  }catch(e){ return null; }
}

function loadData(){
  if(DEMO_MODE){
    try{
      const seededAt = parseInt(localStorage.getItem(DEMO_SEED_KEY), 10);
      const isFresh = !isNaN(seededAt) && (Date.now() - seededAt) < DEMO_RESET_MS;
      if(isFresh){
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
        const valid = validateData(raw);
        if(valid) return valid;
      }
    }catch(e){ /* fall through to reseed */ }
    // No data yet, or the 15-minute demo window has elapsed: start fresh.
    const sample = createSampleData();
    try{ localStorage.setItem(DEMO_SEED_KEY, String(Date.now())); }catch(e){}
    return sample;
  }
  try{
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    const valid = validateData(raw);
    if(valid) return valid;
  }catch(e){ /* fall through */ }
  return createEmptyData();
}
function saveData(){
  App.data.meta.lastModified = nowISO();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(App.data)); }catch(e){ console.warn("Save failed", e); }
}

/* ---- Demo auto-reset ---- */
function resetDemoData(){
  try{ localStorage.setItem(DEMO_SEED_KEY, String(Date.now())); }catch(e){}
  App.data = createSampleData();
  saveData();
  applyTheme();
  applyDensity();
  App.state.openMenuId = null;
  closeModal();
  renderNav();
  renderPage(App.state.page);
  showToast("Demo data has been refreshed.", "info");
}
function demoSeedTimestamp(){
  const t = parseInt(localStorage.getItem(DEMO_SEED_KEY), 10);
  return isNaN(t) ? Date.now() : t;
}
function scheduleDemoReset(){
  if(!DEMO_MODE) return;
  if(demoResetTimer) clearTimeout(demoResetTimer);
  const msLeft = Math.max(1000, DEMO_RESET_MS - (Date.now() - demoSeedTimestamp()));
  demoResetTimer = setTimeout(function(){
    resetDemoData();
    scheduleDemoReset();
  }, msLeft);
  updateDemoCountdownLabel();
  if(demoCountdownTimer) clearInterval(demoCountdownTimer);
  demoCountdownTimer = setInterval(updateDemoCountdownLabel, 15000);
}
function updateDemoCountdownLabel(){
  const el = document.getElementById("demoResetNote");
  if(!el) return;
  const msLeft = Math.max(0, DEMO_RESET_MS - (Date.now() - demoSeedTimestamp()));
  const mins = Math.floor(msLeft/60000);
  const secs = Math.floor((msLeft%60000)/1000);
  el.textContent = "Demo data resets in " + mins + ":" + (secs<10?"0":"") + secs;
}

========================================================================= */
function goalContributions(goalId){
  return App.data.contributions.filter(c=>c.targetType==="goal" && c.targetId===goalId).sort((a,b)=> a.date.localeCompare(b.date));
}
function fundContributions(fundId){
  return App.data.contributions.filter(c=>c.targetType==="fund" && c.targetId===fundId).sort((a,b)=> a.date.localeCompare(b.date));
}
function goalSaved(goalId){ return round2(goalContributions(goalId).reduce((s,c)=>s+c.amount,0)); }
function fundSaved(fundId){ return round2(fundContributions(fundId).reduce((s,c)=>s+c.amount,0)); }
function goalProgress(goal){ if(goal.target<=0) return 0; return clamp((goalSaved(goal.id)/goal.target)*100,0,100); }
function fundProgress(fund){ if(fund.target<=0) return 0; return clamp((fundSaved(fund.id)/fund.target)*100,0,100); }
function goalRemaining(goal){ return Math.max(0, round2(goal.target - goalSaved(goal.id))); }
function fundRemaining(fund){ return Math.max(0, round2(fund.target - fundSaved(fund.id))); }

function recalcGoalStatus(goal){
  const saved = goalSaved(goal.id);
  if(saved >= goal.target - 0.001){
    if(goal.status !== "completed"){ goal.status = "completed"; goal.updatedAt = nowISO(); return "completed"; }
  } else if(goal.status === "completed"){
    goal.status = "active"; goal.updatedAt = nowISO();
  }
  return null;
}
function recalcFundStatus(fund){
  const saved = fundSaved(fund.id);
  if(saved >= fund.target - 0.001){
    if(fund.status !== "completed"){ fund.status = "completed"; fund.updatedAt = nowISO(); return "completed"; }
  } else if(fund.status === "completed"){
    fund.status = "active"; fund.updatedAt = nowISO();
  }
  return null;
}

function getDefaultMilestones(goal){
  const saved = goalSaved(goal.id);
  return [25,50,75,100].map(pct=>{
    const amount = round2(goal.target*pct/100);
    return { id:"default-"+pct, goalId: goal.id, isDefault:true, percent:pct, amount, label: pct+"%", reached: saved >= amount - 0.005 };
  });
}
function getCustomMilestones(goal){
  const saved = goalSaved(goal.id);
  return App.data.milestones.filter(m=>m.goalId===goal.id).map(m=>{
    const amount = m.type==="percent" ? round2(goal.target*m.value/100) : m.value;
    return Object.assign({}, m, { amount, reached: saved >= amount - 0.005 });
  });
}
function getAllMilestones(goal){
  return getDefaultMilestones(goal).concat(getCustomMilestones(goal)).sort((a,b)=>a.amount-b.amount);
}
function getNextMilestone(goal){ return getAllMilestones(goal).find(m=>!m.reached) || null; }
function countReachedMilestones(goal){ return getAllMilestones(goal).filter(m=>m.reached).length; }

function getActiveGoals(){ return App.data.goals.filter(g=>g.status==="active"); }
function getTotalSaved(){ return round2(App.data.goals.reduce((s,g)=>s+goalSaved(g.id),0)); }
function getActiveGoalsCount(){ return getActiveGoals().length; }
function getCompletedGoalsCount(){ return App.data.goals.filter(g=>g.status==="completed").length; }
function getThisMonthTotal(){
  const now = new Date();
  return round2(App.data.contributions.filter(c=>c.targetType==="goal").filter(c=>{
    const d = parseLocalDate(c.date);
    return d && d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }).reduce((s,c)=>s+c.amount,0));
}
function getTotalRemaining(){ return round2(getActiveGoals().reduce((s,g)=>s+goalRemaining(g),0)); }

function showToast(message, type){
  const container = document.getElementById("toastContainer");
  const el = document.createElement("div");
  el.className = "toast" + (type==="error" ? " error" : "");
  el.setAttribute("role","status");
  el.innerHTML = icon(type==="error" ? "close" : "check") + "<span>"+escapeHtml(message)+"</span>";
  container.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(6px)"; el.style.transition="all .25s ease"; setTimeout(()=>el.remove(),260); }, 3200);
}

const modalRoot = document.getElementById("modalRoot");
function openModal(html, kind){
  modalRoot.innerHTML = html;
  modalRoot.classList.add("open");
  App.state.modalKind = kind || null;
  document.body.style.overflow = "hidden";
  const firstInput = modalRoot.querySelector("input, select, textarea, button");
  if(firstInput) setTimeout(()=>firstInput.focus(),30);
}
function closeModal(){
  modalRoot.classList.remove("open");
  modalRoot.innerHTML = "";
  App.state.modalKind = null;
  App.state.confirmCallback = null;
  document.body.style.overflow = "";
}
function refreshOpenModal(){
  const kind = App.state.modalKind;
  if(!kind) return;
  const [type, id] = kind.split(":");
  if(type==="goal-detail"){
    const g = App.data.goals.find(x=>x.id===id);
    if(g) modalRoot.innerHTML = detailModalHTML(g,"goal"); else closeModal();
  } else if(type==="fund-detail"){
    const f = App.data.sinkingFunds.find(x=>x.id===id);
    if(f) modalRoot.innerHTML = detailModalHTML(f,"fund"); else closeModal();
  }
}
function confirmDialog(opts){
  App.state.confirmCallback = opts.onConfirm;
  openModal(
    '<div class="modal" role="dialog" aria-modal="true">'+
      '<div class="confirm-icon'+(opts.danger?'':' neutral')+'">'+icon(opts.danger?"trash":"info")+'</div>'+

}

function milestoneStepperHTML(goal){

  return '<div class="stepper">'+all.map(m=>{

    return '<div class="step'+(m.reached?' reached':'')+(isNext?' next':'')+'">'+
      '<div class="step-dot">'+(m.reached?icon("check"):m.percent+"%")+'</div>'+
      '<div class="step-label">'+m.percent+'%</div>'+
      '<div class="step-amount">'+formatMoney(m.amount)+'</div>'+
      '<div class="step-status">'+(m.reached?"✓ Reached":(isNext?"Next":(m.percent===100?"Final goal":"")))+'</div>'+
    '</div>';
  }).join("")+'</div>';
}

function filteredSortedGoals(){
  const f = App.state.goalsFilter;
  let list = App.data.goals.filter(g=>{
    if(f.status!=="all" && g.status!==f.status) return false;
    if(f.search && !g.name.toLowerCase().includes(f.search.toLowerCase())) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(f.sort==="progress") return goalProgress(b)-goalProgress(a);
    if(f.sort==="date") return (a.targetDate||"9999").localeCompare(b.targetDate||"9999");
    if(f.sort==="name") return a.name.localeCompare(b.name);
    return (b.updatedAt||"").localeCompare(a.updatedAt||"");
  });
  return list;
}

function filteredSortedFunds(){
  const f = App.state.fundsFilter;
  let list = App.data.sinkingFunds.filter(x=>{
    if(f.status!=="all" && x.status!==f.status) return false;
    if(f.search && !x.name.toLowerCase().includes(f.search.toLowerCase())) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(f.sort==="progress") return fundProgress(b)-fundProgress(a);
    if(f.sort==="date") return (a.deadline||"9999").localeCompare(b.deadline||"9999");
    if(f.sort==="name") return a.name.localeCompare(b.name);
    return (b.updatedAt||"").localeCompare(a.updatedAt||"");
  });
  return list;
}
function renderFundsList(){
  const container = document.getElementById("funds-list");
  if(!container) return;
  const list = filteredSortedFunds();
  if(list.length===0){
    container.innerHTML = App.data.sinkingFunds.length===0
      ? emptyStateHTML("wallet","Plan your future expenses.","Sinking funds help you save gradually for things you know are coming.","Create sinking fund","open-fund-modal")
      : '<div class="card empty-state"><div class="icon-badge">'+icon("search")+'</div><h3>No matching funds</h3><p>Try a different search or filter.</p></div>';
  } else {
    container.innerHTML = '<div class="grid grid-3">'+list.map(fundCardHTML).join("")+'</div>';
  }
}

function getMonthsRange(n){
  const arr = []; const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    arr.push({ year:d.getFullYear(), month:d.getMonth(), label: d.toLocaleString(undefined,{month:"short"}) });
  }
  return arr;
}
function monthlyContributionTotals(n){
  const months = getMonthsRange(n);
  const totals = months.map(()=>0);
  App.data.contributions.forEach(c=>{
    const d = parseLocalDate(c.date);
    if(!d) return;
    months.forEach((m,i)=>{ if(d.getFullYear()===m.year && d.getMonth()===m.month) totals[i]+=c.amount; });
  });
  return months.map((m,i)=>({label:m.label, value: round2(totals[i])}));
}
function cumulativeSavingsSeries(n){
  const months = getMonthsRange(n);
  const rangeStart = new Date(months[0].year, months[0].month, 1);
  let base = 0;
  App.data.contributions.forEach(c=>{ const d = parseLocalDate(c.date); if(d && d<rangeStart) base += c.amount; });
  const monthly = monthlyContributionTotals(n);
  let running = base;
  return monthly.map(m=>{ running += m.value; return { label:m.label, value: round2(running) }; });
}
function buildLineChart(series){
  const w=640,h=220,pad=34;
  const max = Math.max(...series.map(s=>s.value),1);
  const step = (w-2*pad)/Math.max(1,(series.length-1));
  const pts = series.map((s,i)=>({ x: pad+i*step, y: h-pad-(s.value/max)*(h-2*pad) }));
  const pathD = pts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  const areaD = pathD+" L"+pts[pts.length-1].x.toFixed(1)+","+(h-pad)+" L"+pts[0].x.toFixed(1)+","+(h-pad)+" Z";
  const circles = pts.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="var(--gold)"/>').join("");
  const labels = series.map((s,i)=>'<text x="'+pts[i].x.toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle" class="chart-label">'+s.label+'</text>').join("");
  return '<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet">'+
    '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="var(--gold)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+areaD+'" fill="url(#areaGrad)"/>'+
    '<path d="'+pathD+'" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    circles+labels+
  '</svg>';
}
function buildBarChart(series){
  const w=640,h=220,pad=34;
  const max = Math.max(...series.map(s=>s.value),1);
  const bw = (w-2*pad)/series.length*0.6;
  const gap = (w-2*pad)/series.length;
  const bars = series.map((s,i)=>{
    const bh = (s.value/max)*(h-2*pad);
    const x = pad+i*gap+(gap-bw)/2;
    const y = h-pad-bh;
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="4" fill="var(--blue)"/>'+
      '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle" class="chart-label">'+s.label+'</text>';
  }).join("");
  return '<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet">'+bars+'</svg>';
}
function renderAnalyticsPage(){
  const el = document.getElementById("page-analytics");
  const totalSaved = getTotalSaved();
  const allContribs = App.data.contributions;
  const totalContributed = round2(allContribs.reduce((s,c)=>s+c.amount,0));
  const avgContribution = allContribs.length ? round2(totalContributed/allContribs.length) : 0;
  const now = new Date();
  const monthTotal = round2(allContribs.filter(c=>{ const d=parseLocalDate(c.date); return d && d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); }).reduce((s,c)=>s+c.amount,0));
  const yearTotal = round2(allContribs.filter(c=>{ const d=parseLocalDate(c.date); return d && d.getFullYear()===now.getFullYear(); }).reduce((s,c)=>s+c.amount,0));

  const compareGoals = [...App.data.goals].sort((a,b)=>goalProgress(b)-goalProgress(a));

  '<div class="page-header"><div><h1>Analytics</h1><p>A clear look at your savings journey — always based on your real data.</p></div></div>'+
  '<div class="grid grid-4 mt-2">'+
    statMini("Total Saved", formatMoney(totalSaved))+

  '</div>'+
  '<div class="grid grid-4 mt-2">'+
    statMini("Total Remaining", formatMoney(getTotalRemaining()))+
    statMini("Average Contribution", formatMoney(avgContribution))+
    statMini("This Month", formatMoney(monthTotal))+
    statMini("This Year", formatMoney(yearTotal))+
  '</div>'+
  '<div class="grid grid-2 mt-3">'+
    '<div class="card chart-card"><div class="section-title">'+icon("barchart")+' Savings Accumulated Over Time</div><div class="mt-2">'+buildLineChart(cumulativeSavingsSeries(8))+'</div></div>'+
    '<div class="card chart-card"><div class="section-title">'+icon("calendar")+' Contributions by Month</div><div class="mt-2">'+buildBarChart(monthlyContributionTotals(6))+'</div></div>'+
  '</div>'+
  '<div class="card mt-3">'+
    '<div class="section-title">'+icon("target")+' Goal Progress Comparison</div>'+

}

function addContribution(targetType, targetId, amount, date, note){
  amount = round2(amount);
  let entity = targetType==="goal" ? App.data.goals.find(g=>g.id===targetId) : App.data.sinkingFunds.find(f=>f.id===targetId);
  if(!entity){ showToast("Could not find the selected goal or fund.","error"); return; }

  let beforeMilestones = 0;
  if(targetType==="goal") beforeMilestones = countReachedMilestones(entity);

  App.data.contributions.push({ id: uid("c"), targetType, targetId, amount, date, note: (note||"").trim(), createdAt: nowISO() });

  let statusChange = null;
  if(targetType==="goal"){ statusChange = recalcGoalStatus(entity); entity.updatedAt = nowISO(); }
  else { statusChange = recalcFundStatus(entity); entity.updatedAt = nowISO(); }

  afterMutation();

  const msgOn = App.data.settings.motivationalMessages;
  if(statusChange==="completed"){
    showToast(msgOn ? "Goal completed! 🎉 " + entity.name : "Marked as completed.");
  } else if(targetType==="goal" && msgOn){
    const afterMilestones = countReachedMilestones(entity);
    if(afterMilestones > beforeMilestones){
      showToast("Milestone reached! You're building momentum. 🌟");
    } else {
      showToast("Nice! You're "+formatMoney(amount)+" closer to "+entity.name+".");
    }
  } else {
    showToast("Contribution of "+formatMoney(amount)+" added.");
  }
}

/* =========================================================================
   CSV EXPORT / IMPORT
========================================================================= */
function csvEscape(val){
  val = (val===undefined || val===null) ? "" : String(val);
  if(/[",\n\r]/.test(val)) val = '"'+val.replace(/"/g,'""')+'"';
  return val;
}
const CSV_HEADER = ["record_type","id","name","icon","color","target","amount","date","status","note","target_type","target_id","milestone_type","milestone_value","milestone_label","setting_key","setting_value","created_at","updated_at"];

function exportCSV(){
  const rows = [CSV_HEADER];
  App.data.goals.forEach(g=>{
    rows.push(["goal", g.id, g.name, g.icon, g.color, g.target, goalSaved(g.id), g.targetDate, g.status, g.note, "", "", "", "", "", "", "", g.createdAt, g.updatedAt]);
  });
  App.data.sinkingFunds.forEach(f=>{
    rows.push(["sinking_fund", f.id, f.name, f.icon, f.color, f.target, fundSaved(f.id), f.deadline, f.status, f.note, "", "", "", "", "", "", "", f.createdAt, f.updatedAt]);
  });
  App.data.contributions.forEach(c=>{
    rows.push(["contribution", c.id, "", "", "", "", c.amount, c.date, "", c.note, c.targetType, c.targetId, "", "", "", "", "", c.createdAt, ""]);
  });
  App.data.milestones.forEach(m=>{
    rows.push(["milestone", m.id, "", "", "", "", "", "", "", m.note, "", m.goalId, m.type, m.value, m.label, "", "", m.createdAt, ""]);
  });
  Object.entries(App.data.settings).forEach(([k,v])=>{
    rows.push(["settings","","","","","","","","","","","","","","",k,String(v),"",""]);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const dateStr = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  a.href = url; a.download = "goalsave-backup-"+dateStr+".csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("Backup exported successfully.");
}

function parseCSV(text){
  const rows = []; let row = []; let field = ""; let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* ignore */ }
      else { field += c; }
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===""));
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const text = String(e.target.result || "");
      const rows = parseCSV(text);
      if(rows.length < 2){ showToast("The CSV file appears to be empty.","error"); return; }
      const header = rows[0].map(h=>h.trim());
      const idx = {}; CSV_HEADER.forEach(h=> idx[h] = header.indexOf(h));
      if(idx.record_type === -1){ showToast("This doesn't look like a GoalSave CSV file.","error"); return; }

      const goals=[], funds=[], contributions=[], milestones=[]; const settings = {};
      let skipped = 0;

      for(let i=1;i<rows.length;i++){
        const r = rows[i];
        const get = (key)=> idx[key]>-1 ? (r[idx[key]]||"").trim() : "";
        const type = get("record_type");
        if(type === "goal"){
          const target = parseFloat(get("target"));
          if(get("id") && get("name") && isFinite(target) && target>0){
            goals.push({ id:get("id"), name:get("name"), icon:get("icon")||"target", color:get("color")||"gold", target: round2(target),
              targetDate: isValidDateStr(get("date"))?get("date"):"", status:get("status")||"active", note:get("note")||"",
              createdAt:get("created_at")||nowISO(), updatedAt:get("updated_at")||get("created_at")||nowISO() });
          } else skipped++;
        } else if(type === "sinking_fund"){
          const target = parseFloat(get("target"));
          if(get("id") && get("name") && isFinite(target) && target>0){
            funds.push({ id:get("id"), name:get("name"), icon:get("icon")||"wallet", color:get("color")||"blue", target: round2(target),
              deadline: isValidDateStr(get("date"))?get("date"):"", status:get("status")||"active", note:get("note")||"",
              createdAt:get("created_at")||nowISO(), updatedAt:get("updated_at")||get("created_at")||nowISO() });
          } else skipped++;
        } else if(type === "contribution"){
          const amount = parseFloat(get("amount"));
          if(get("id") && (get("target_type")==="goal"||get("target_type")==="fund") && get("target_id") && isFinite(amount) && amount>0 && isValidDateStr(get("date"))){
            contributions.push({ id:get("id"), targetType:get("target_type"), targetId:get("target_id"), amount: round2(amount), date:get("date"), note:get("note")||"", createdAt:get("created_at")||nowISO() });
          } else skipped++;
        } else if(type === "milestone"){
          const value = parseFloat(get("milestone_value"));
          if(get("id") && get("target_id") && (get("milestone_type")==="percent"||get("milestone_type")==="amount") && isFinite(value) && value>0){
            milestones.push({ id:get("id"), goalId:get("target_id"), type:get("milestone_type"), value: round2(value), label:get("milestone_label")||(get("milestone_type")+" checkpoint"), note:get("note")||"", createdAt:get("created_at")||nowISO() });
          } else skipped++;
        } else if(type === "settings"){
          const key = get("setting_key");
          if(key) settings[key] = get("setting_value");
          else skipped++;
        } else {
          skipped++;
        }
      }

      if(settings.smallWinAmount) settings.smallWinAmount = parseFloat(settings.smallWinAmount) || 25;
      if(settings.dayStartOffset) settings.dayStartOffset = parseInt(settings.dayStartOffset,10) || 0;
      if(settings.motivationalMessages !== undefined) settings.motivationalMessages = settings.motivationalMessages === "true";

      const goalIds = new Set(goals.map(g=>g.id));
      const fundIds = new Set(funds.map(f=>f.id));
      const cleanContribs = contributions.filter(c => c.targetType==="goal" ? goalIds.has(c.targetId) : fundIds.has(c.targetId));
      const cleanMilestones = milestones.filter(m => goalIds.has(m.goalId));
      const orphanSkipped = (contributions.length - cleanContribs.length) + (milestones.length - cleanMilestones.length);

      if(goals.length===0 && funds.length===0 && cleanContribs.length===0){
        showToast("No valid records found in this CSV file.","error");
        return;
      }

      const candidate = validateData({
        version:1,
        settings: Object.assign(defaultSettings(), settings),
        goals, sinkingFunds: funds, contributions: cleanContribs, milestones: cleanMilestones,
        meta: { createdAt: nowISO(), lastModified: nowISO() }
      });

      if(!candidate){ showToast("The CSV file could not be processed.","error"); return; }

      App.state.importCandidate = candidate;
      const totalSkipped = skipped + orphanSkipped;
      confirmDialog({
        title: "Import & Replace Data?",
        message: "Found "+goals.length+" goals, "+funds.length+" sinking funds, "+cleanContribs.length+" contributions, and "+cleanMilestones.length+" milestones."+
                 (totalSkipped>0 ? " ("+totalSkipped+" row(s) were skipped due to invalid or unsupported data.)" : "")+
                 " This will replace ALL current GoalSave data and cannot be undone. Continue?",
        confirmText: "Import & Replace",
        danger: true,
        onConfirm: ()=>{
          App.data = App.state.importCandidate;
          App.state.importCandidate = null;
          saveData();
          applyTheme(); applyDensity();
          setPage("home");
          showToast("Data imported successfully.");
        }
      });
    }catch(err){
      console.error(err);
      showToast("Could not read this CSV file. Please check the format.","error");
    }
  };
  reader.onerror = function(){ showToast("There was a problem reading the file.","error"); };
  reader.readAsText(file);
}

function deleteGoal(id){
  App.data.goals = App.data.goals.filter(g=>g.id!==id);
  App.data.contributions = App.data.contributions.filter(c=>!(c.targetType==="goal" && c.targetId===id));
  App.data.milestones = App.data.milestones.filter(m=>m.goalId!==id);
}
function deleteFund(id){
  App.data.sinkingFunds = App.data.sinkingFunds.filter(f=>f.id!==id);
  App.data.contributions = App.data.contributions.filter(c=>!(c.targetType==="fund" && c.targetId===id));
}

/* =========================================================================
   ACTION HANDLER (event delegation)
========================================================================= */
function closeOpenMenu(){
  document.querySelectorAll(".menu-dropdown").forEach(d=>d.classList.add("hidden"));
  App.state.openMenuId = null;
}

function handleAction(action, el, ds){
  switch(action){
    case "nav":
      setPage(ds.page); break;
    case "toggle-sidebar":
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebarBackdrop").classList.toggle("show");
      break;
    case "close-sidebar":
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarBackdrop").classList.remove("show");
      break;
    case "toggle-menu": {
      const cardMenu = el.closest(".card-menu");
      const dd = cardMenu ? cardMenu.querySelector(".menu-dropdown") : null;
      const wasHidden = dd ? dd.classList.contains("hidden") : true;
      closeOpenMenu();
      if(dd && wasHidden){ dd.classList.remove("hidden"); App.state.openMenuId = ds.id; }
      break;
    }
    case "close-modal": closeModal(); break;
    case "confirm-yes": {
      const cb = App.state.confirmCallback; App.state.confirmCallback=null;
      closeModal(); if(cb) cb();
      break;
    }
    case "edit-name": openModal(editNameModalHTML(), "edit-name"); break;

    case "open-goal-modal": {
      closeOpenMenu();
      const goal = ds.id ? App.data.goals.find(g=>g.id===ds.id) : null;
      openModal(goalModalHTML(goal), goal ? "goal-edit:"+goal.id : "goal-new");
      break;
    }
    case "open-fund-modal": {
      closeOpenMenu();
      const fund = ds.id ? App.data.sinkingFunds.find(f=>f.id===ds.id) : null;
      openModal(fundModalHTML(fund), fund ? "fund-edit:"+fund.id : "fund-new");
      break;
    }
    case "open-contribution-modal": {
      closeOpenMenu();
      openModal(contributionModalHTML(ds.type, ds.id), "contribution");
      break;
    }
    case "open-milestone-modal": {
      closeOpenMenu();
      openModal(milestoneModalHTML(ds.goalId), "milestone");
      break;
    }
    case "open-goal-detail": {
      closeOpenMenu();
      const g = App.data.goals.find(x=>x.id===ds.id);
      if(g) openModal(detailModalHTML(g,"goal"), "goal-detail:"+g.id);
      break;
    }
    case "open-fund-detail": {
      closeOpenMenu();
      const f = App.data.sinkingFunds.find(x=>x.id===ds.id);
      if(f) openModal(detailModalHTML(f,"fund"), "fund-detail:"+f.id);
      break;
    }
    case "toggle-pause-goal": {
      const g = App.data.goals.find(x=>x.id===ds.id);
      if(g && g.status!=="completed"){ g.status = g.status==="paused"?"active":"paused"; g.updatedAt=nowISO(); afterMutation(); showToast(g.status==="paused"?"Goal paused.":"Goal resumed."); }
      break;
    }
    case "complete-goal": {
      const g = App.data.goals.find(x=>x.id===ds.id);
      if(g){ g.status="completed"; g.updatedAt=nowISO(); afterMutation(); showToast("Goal completed! 🎉"); }
      break;
    }
    case "toggle-pause-fund": {
      const f = App.data.sinkingFunds.find(x=>x.id===ds.id);
      if(f && f.status!=="completed"){ f.status = f.status==="paused"?"active":"paused"; f.updatedAt=nowISO(); afterMutation(); showToast(f.status==="paused"?"Fund paused.":"Fund resumed."); }
      break;
    }
    case "complete-fund": {
      const f = App.data.sinkingFunds.find(x=>x.id===ds.id);
      if(f){ f.status="completed"; f.updatedAt=nowISO(); afterMutation(); showToast("Sinking fund fully funded! 🎉"); }
      break;
    }
    case "delete-goal": {
      closeOpenMenu();
      const g = App.data.goals.find(x=>x.id===ds.id);
      if(!g) return;
      const count = goalContributions(g.id).length;
      confirmDialog({
        title: "Delete \""+g.name+"\"?",
        message: "This will permanently delete this goal"+(count?" and its "+count+" contribution record(s)":"")+". This cannot be undone.",
        confirmText: "Delete Goal", danger:true,
        onConfirm: ()=>{ deleteGoal(g.id); closeModal(); afterMutation(); showToast("Goal deleted."); }
      });
      break;
    }
    case "delete-fund": {
      closeOpenMenu();
      const f = App.data.sinkingFunds.find(x=>x.id===ds.id);
      if(!f) return;
      const count = fundContributions(f.id).length;
      confirmDialog({
        title: "Delete \""+f.name+"\"?",
        message: "This will permanently delete this fund"+(count?" and its "+count+" contribution record(s)":"")+". This cannot be undone.",
        confirmText: "Delete Fund", danger:true,
        onConfirm: ()=>{ deleteFund(f.id); closeModal(); afterMutation(); showToast("Sinking fund deleted."); }
      });
      break;
    }
    case "delete-contribution": {
      const cid = ds.id;
      const returnKind = ds.entityType==="goal" ? "goal-detail:"+ds.entityId : "fund-detail:"+ds.entityId;
      confirmDialog({
        title:"Delete contribution?",
        message:"This record will be removed and totals will recalculate automatically.",
        confirmText:"Delete", danger:true,
        onConfirm: ()=>{
          App.data.contributions = App.data.contributions.filter(c=>c.id!==cid);
          if(ds.entityType==="goal"){ const g=App.data.goals.find(x=>x.id===ds.entityId); if(g) recalcGoalStatus(g); }
          else { const f=App.data.sinkingFunds.find(x=>x.id===ds.entityId); if(f) recalcFundStatus(f); }
          // Return to the detail view (modal stays open) instead of closing it
          App.state.modalKind = returnKind;
          saveData();
          renderPage(App.state.page);
          refreshOpenModal();
          showToast("Contribution removed.");
        }
      });
      break;
    }
    case "delete-milestone": {
      const mid = ds.id;
      confirmDialog({
        title:"Delete milestone?",
        message:"This custom checkpoint will be removed.",
        confirmText:"Delete", danger:true,
        onConfirm: ()=>{ App.data.milestones = App.data.milestones.filter(m=>m.id!==mid); closeModal(); afterMutation(); showToast("Milestone removed."); }
      });
      break;
    }
    case "export-csv": exportCSV(); break;
    case "trigger-import": document.getElementById("importFileInput").click(); break;
    case "delete-all-data": {
      confirmDialog({
        title:"Delete All Data?",
        message:"This permanently deletes every goal, fund, contribution and milestone stored by GoalSave in this browser, and cannot be undone. You'll start from a clean, empty state.",
        confirmText:"Delete Everything", danger:true,
        onConfirm: ()=>{
          try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
          App.data = createEmptyData();
          saveData(); applyTheme(); applyDensity();
          closeModal();
          setPage("home");
          showToast("All data deleted.");
        }
      });
      break;
    }
  }
}

/* =========================================================================
   ROUTER
========================================================================= */
function renderPage(page){
  switch(page){
    case "home": renderHome(); break;
    case "goals": renderGoalsPage(); break;
    case "funds": renderFundsPage(); break;
    case "milestones": renderMilestonesPage(); break;
    case "analytics": renderAnalyticsPage(); break;
    case "settings": renderSettingsPage(); break;
  }
}
function setPage(page){
  App.state.page = page;
  renderNav();
  document.querySelectorAll(".page").forEach(p=> p.classList.toggle("active-page", p.id==="page-"+page));
  renderPage(page);
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarBackdrop").classList.remove("show");
  window.scrollTo(0,0);
}

/* =========================================================================
   GLOBAL EVENT WIRING
========================================================================= */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if(el){ handleAction(el.dataset.action, el, el.dataset); }

  // icon/color pickers
  const pickIcon = e.target.closest("[data-pick-icon]");
  if(pickIcon){
    const targetInput = document.getElementById(pickIcon.dataset.target);
    if(targetInput){ targetInput.value = pickIcon.dataset.pickIcon; }
    pickIcon.parentElement.querySelectorAll(".pick-btn").forEach(b=>{b.classList.remove("selected"); b.setAttribute("aria-pressed","false");});
    pickIcon.classList.add("selected"); pickIcon.setAttribute("aria-pressed","true");
  }
  const pickColor = e.target.closest("[data-pick-color]");
  if(pickColor){
    const targetInput = document.getElementById(pickColor.dataset.target);
    if(targetInput){ targetInput.value = pickColor.dataset.pickColor; }
    pickColor.parentElement.querySelectorAll(".swatch").forEach(b=>{b.classList.remove("selected"); b.setAttribute("aria-pressed","false");});
    pickColor.classList.add("selected"); pickColor.setAttribute("aria-pressed","true");
  }
  // milestone type segmented
  const msType = e.target.closest("#ms-type-seg button");
  if(msType){
    document.getElementById("ms-type").value = msType.dataset.type;
    msType.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
    msType.classList.add("active");
    document.getElementById("ms-value-label").textContent = msType.dataset.type==="percent" ? "Percent of goal (%)" : "Fixed amount";
  }

  // close dropdown menus on outside click
  if(App.state.openMenuId && !e.target.closest(".card-menu")) closeOpenMenu();
}, false);

document.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === " "){
    const el = e.target.closest('[role="button"][data-action]');
    if(el){ e.preventDefault(); handleAction(el.dataset.action, el, el.dataset); }
  }
  if(e.key === "Escape"){
    if(modalRoot.classList.contains("open")) closeModal();
    closeOpenMenu();
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarBackdrop").classList.remove("show");
  }
}, false);

document.addEventListener("submit", function(e){
  if(e.target.id === "goal-form"){ e.preventDefault(); submitGoalForm(); }
  else if(e.target.id === "fund-form"){ e.preventDefault(); submitFundForm(); }
  else if(e.target.id === "contribution-form"){ e.preventDefault(); submitContributionForm(); }
  else if(e.target.id === "milestone-form"){ e.preventDefault(); submitMilestoneForm(); }
  else if(e.target.id === "name-form"){ e.preventDefault(); submitNameForm(); }
}, false);

modalRoot.addEventListener("click", function(e){ if(e.target === modalRoot) closeModal(); });

document.getElementById("hamburgerBtn").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("sidebarBackdrop").classList.add("show");
});
document.getElementById("sidebarCloseBtn").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarBackdrop").classList.remove("show");
});
document.getElementById("sidebarBackdrop").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebarBackdrop").classList.remove("show");
});
document.getElementById("importFileInput").addEventListener("change", function(e){
  const file = e.target.files && e.target.files[0];
  if(file) handleImportFile(file);
  e.target.value = "";
});

/* =========================================================================
   BOOT
========================================================================= */
function boot(){
  App.data = loadData();
  saveData();
  applyTheme();
  applyDensity();
  renderNav();
  renderPage("home");
  scheduleDemoReset();
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

})();
</script>
</body>
</html>
